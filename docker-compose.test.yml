services:
    serasa_brain_agriculture_db_test:
        image: postgres:18.6
        container_name: serasa_brain_agriculture_db_test
        restart: always
        ports:
            - "5433:5432"
        environment:
            - POSTGRES_USER=brain_agriculture_user_test
            - POSTGRES_PASSWORD=brain_agriculture_password_test
            - POSTGRES_DB=brain_agriculture_db_test
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
            interval: 1s
            timeout: 5s
            retries: 10
        volumes:
            - pgdatatest:/var/lib/postgresql/MAJOR/docker
volumes:
    pgdatatest: