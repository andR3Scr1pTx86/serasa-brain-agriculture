services:
    serasa_brain_agriculture:
        build: .
        container_name: serasa_brain_agriculture
        ports:
            - '3000:3000'
        environment:
            - PORT=3000
            - NODE_ENV=dev
        env_file: .env.dev
        depends_on:
            serasa_brain_agriculture_db:
                condition: service_healthy
        volumes:
            - ./src:/usr/src/app/src
    serasa_brain_agriculture_db:
        image: postgres:18.6
        container_name: serasa_brain_agriculture_db
        restart: always
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=brain_agriculture_user
            - POSTGRES_PASSWORD=brain_agriculture_password
            - POSTGRES_DB=brain_agriculture_db
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
            interval: 1s
            timeout: 5s
            retries: 10
        volumes:
            - pgdata:/var/lib/postgresql/MAJOR/docker
volumes:
    pgdata: